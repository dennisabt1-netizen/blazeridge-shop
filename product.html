<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/blazeridge-shop/" />
  <title>Product — BlazeRidge</title>
  <meta name="description" content="BlazeRidge digital tool details and purchase options." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header class="wrap header">
    <a class="logo" href="index.html">Blaze<span>Ridge</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><span class="badge" data-cart-count hidden>0</span></a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a class="btn-login" href="login.html">Log in</a>
    </nav>
  </header>

  <main>
    <div class="wrap" style="padding-top:1.25rem">
      <a class="link-back" href="shop.html">← Back to shop</a>
    </div>
    <section class="wrap product-layout" id="product-root">
      <p class="muted">Loading…</p>
    </section>
  </main>
  <footer class="wrap footer">
    <div class="footer-grid">
      <div>
        <p>Educational content only — not personalized financial, tax, or investment advice.</p>
        <p>© BlazeRidge · <a href="https://www.youtube.com/@blazeridgeorigin" target="_blank" rel="noopener">@blazeridgeorigin</a></p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="login.html">Log in</a>
      </nav>
    </div>
  </footer>
  <script src="config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    (function () {
      const p = BlazeRidgeApp.productByParam();
      const root = document.getElementById("product-root");
      if (!p) {
        root.innerHTML = `<div class="empty-state"><h2>Product not found</h2><p><a class="btn" href="shop.html">Browse shop</a></p></div>`;
        return;
      }
      document.title = p.name + " — BlazeRidge";
      const money = BlazeRidgeApp.money;
      root.innerHTML = `
        <div class="product-visual" aria-hidden="true">${p.name.split(" ").slice(0, 2).join(" ")}</div>
        <div class="product-meta">
          <p class="tag">${p.tag}</p>
          <h1>${p.name}</h1>
          <p class="muted">${p.longDescription || p.description}</p>
          <span class="price">${money(p.price)}</span>
          <div class="actions">
            <button type="button" class="btn" data-add-cart="${p.id}">Add to cart</button>
            <a class="btn-ghost" href="${p.paymentLink}" target="_blank" rel="noopener">Buy now</a>
          </div>
          <p class="muted" style="margin-top:1.25rem;font-size:.85rem">Secure checkout via Stripe Payment Link. Instant digital delivery after payment.</p>
        </div>
      `;
      BlazeRidgeApp.bindAddButtons(root);
    })();
  </script>

</body>
</html>
